name: Application Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JARVIS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: JARVIS.apk

      - name: Publier l'APK à télécharger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-android --yes --cleanup-tag || true
          gh release create jarvis-android JARVIS.apk \
            --title "JARVIS Android" \
            --notes "Dernière version de l'application JARVIS (branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}). Depuis ton téléphone, touche JARVIS.apk pour la télécharger puis ouvre le fichier pour l'installer." \
            --target "$GITHUB_SHA"
