name: Application Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Télécharger le modèle vocal (mot « Jarvis »)
        run: |
          curl -sSfL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          rm -rf android/app/src/main/assets/model-en-us
          mkdir -p android/app/src/main/assets
          mv vosk-model-small-en-us-0.15 android/app/src/main/assets/model-en-us
          echo "vosk-model-small-en-us-0.15" > android/app/src/main/assets/model-en-us/uuid

      - name: Vérifier que « Jarvis » est reconnu
        run: |
          set -o pipefail
          sudo apt-get install -y -q espeak-ng sox > /dev/null
          pip install -q vosk
          python3 .github/scripts/check_wake_word.py android/app/src/main/assets/model-en-us 2>&1 | tee wake-check.log
          if grep -q "missing in vocabulary" wake-check.log; then
            echo "::error::« jarvis » est absent du vocabulaire du modèle."
            exit 1
          fi

      - name: Expérience — « Jarvis » en français
        continue-on-error: true
        run: |
          curl -sSfL -o fr.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          unzip -q fr.zip
          python3 .github/scripts/explore_fr.py vosk-model-small-fr-0.22 android/app/src/main/assets/model-en-us 2>&1 | tee explore.log | grep -E "notice|Error|error" | head -40
          grep -q "missing in vocabulary" explore.log && echo "::notice::VOCABULAIRE : mot manquant" || echo "::notice::VOCABULAIRE : jarvis present dans les deux modeles"

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk JARVIS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: JARVIS.apk

      - name: Publier l'APK à télécharger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-android --yes --cleanup-tag || true
          gh release create jarvis-android JARVIS.apk \
            --title "JARVIS Android" \
            --notes "Dernière version de l'application JARVIS (branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}). Depuis ton téléphone, touche JARVIS.apk pour la télécharger puis ouvre le fichier pour l'installer." \
            --target "$GITHUB_SHA"
